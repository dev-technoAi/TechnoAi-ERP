<?xml version="1.0" encoding="UTF-8"?>
<svg width="621px" height="196px" viewBox="0 0 621 196" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Techno AI Logo</title>
    <!-- Techno AI Horizontal Brand Mark -->
    <g transform="translate(10, 18)">
        <!-- Squircle Icon -->
        <rect x="0" y="8" width="144" height="144" rx="36" fill="#0d1417" />
        <rect x="3" y="11" width="138" height="138" rx="33" fill="none" stroke="#289fb7" stroke-width="5" stroke-opacity="0.5" />
        <!-- Lowercase 'a' inside icon -->
        <path d="M40 70 H78 V118 H64 V108 C60 116 50 120 40 120 C26 120 18 110 18 96 C18 80 30 72 48 72 H64 V70 C64 62 58 56 46 56 C36 56 30 60 26 66 L18 58 C24 48 36 44 50 44 C72 44 80 54 80 72 V106 M64 82 H48 C36 82 32 86 32 94 C32 102 38 106 48 106 C58 106 64 98 64 88 V82 Z" fill="#FFFFFF"/>
        <!-- Lowercase 'i' inside icon -->
        <rect x="96" y="68" width="16" height="50" rx="4" fill="#FFFFFF"/>
        <circle cx="104" cy="50" r="9" fill="#289fb7"/>

        <!-- Text 'techno' -->
        <text x="175" y="112" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-size="82" font-weight="800" fill="#0d1417" letter-spacing="-3">techno</text>
        
        <!-- Slashes '//:' -->
        <text x="475" y="112" font-family="'Noto Sans', monospace, sans-serif" font-size="82" font-weight="900" fill="#289fb7" letter-spacing="-4">//:</text>

        <!-- Text 'ai' -->
        <text x="535" y="112" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-size="82" font-weight="800" fill="#0d1417" letter-spacing="-3">ai</text>
    </g>
</svg>
